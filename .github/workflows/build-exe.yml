
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 matplotlib pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name ClientApp `
            --collect-all PySide6 `
            --collect-all matplotlib `
            client.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClientApp-Windows
          path: dist/ClientApp.exe
          if-no-files-found: error
