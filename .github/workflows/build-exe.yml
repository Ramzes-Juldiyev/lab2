name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ] # Запускать при пуше в главную ветку
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-latest # GitHub выдаёт виртуальную машину с Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Можно указать вашу версию, например '3.12'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      # Собираем client.py в один exe-файл с именем ClientApp
      # Если нужны сторонние библиотеки, их надо установить в шаге выше
      run: pyinstaller --onefile --name ClientApp client.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/ClientApp.exe
